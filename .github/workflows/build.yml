name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a release with this tag (e.g. v0.1.0); leave empty to just build"
        required: false
        default: ""

permissions:
  contents: write # release uploads

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./internal/...
      - run: go test ./internal/...

  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/... # darwin-only paths (Trash) compile and test here
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build universal .app (Intel + Apple Silicon)
        run: wails build -platform darwin/universal
      - name: Zip the app
        run: ditto -c -k --keepParent build/bin/QK.app QK-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QK-macos
          path: QK-macos.zip
      - name: Attach to release
        # Fires on v* tag pushes, or on manual dispatch with a release_tag —
        # in the latter case the action creates the tag at this commit.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: QK-macos.zip
          generate_release_notes: true
